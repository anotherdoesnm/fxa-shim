services:
  fxa-shim:
    build: .
    container_name: fxa-shim
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SYNC_BASE_URL: ${SYNC_BASE_URL:-http://localhost:8001}
      # Issuer written into JWTs. Keep it equal to the URL syncstorage uses
      # for FXA_OAUTH_SERVER_URL (the internal Docker address by default).
      TOKEN_ISSUER: ${TOKEN_ISSUER:-http://fxa-shim:8000}
      DATA_FILE: /data/state.json
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-session-secret-change-me}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PKCE: ${OIDC_PKCE:-1}
      OIDC_TOKEN_AUTH: ${OIDC_TOKEN_AUTH:-post}
      DEV_LOGIN: ${DEV_LOGIN:-0}
      KEY_MODE: ${KEY_MODE:-server}
      DECLINE_PASSWORDS: ${DECLINE_PASSWORDS:-1}
      DECLINE_ADDRESSES: ${DECLINE_ADDRESSES:-1}
      DECLINE_CREDITCARDS: ${DECLINE_CREDITCARDS:-1}
    ports:
      - "8000:8000"
    volumes:
      - fxa-shim-data:/data
    restart: unless-stopped

  sync-db:
    image: postgres:16-alpine
    container_name: fxa-sync-db
    environment:
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpass}
      POSTGRES_DB: syncstorage
    volumes:
      - sync-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d syncstorage"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  syncserver:
    image: ghcr.io/mozilla-services/syncstorage-rs/syncserver-postgres:${SYNCSERVER_VERSION:-latest}
    platform: linux/amd64
    container_name: fxa-syncserver
    depends_on:
      sync-db:
        condition: service_healthy
      fxa-shim:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: 8000
      SYNC_MASTER_SECRET: ${SYNC_MASTER_SECRET:-dev-master-secret-change-me}
      SYNC_SYNCSTORAGE__DATABASE_URL: postgres://sync:${POSTGRES_PASSWORD:-syncpass}@sync-db:5432/syncstorage
      SYNC_TOKENSERVER__DATABASE_URL: postgres://sync:${POSTGRES_PASSWORD:-syncpass}@sync-db:5432/syncstorage
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__NODE_TYPE: postgres
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${FXA_EMAIL_DOMAIN:-localhost}
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: ${FXA_OAUTH_SERVER_URL:-http://fxa-shim:8000}
      SYNC_TOKENSERVER__INIT_NODE_URL: ${SYNC_NODE_URL:-http://localhost:8001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  fxa-shim-data:
  sync-db-data:
